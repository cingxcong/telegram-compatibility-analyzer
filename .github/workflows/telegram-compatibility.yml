name: Telegram Compatibility Analysis

on:
  workflow_dispatch:
    inputs:
      old_apk_url:
        description: "Old Telegram APK HTTPS URL"
        required: true
        type: string
      new_apk_url:
        description: "New Telegram APK HTTPS URL"
        required: true
        type: string
      old_sha256:
        description: "Optional SHA-256 for old APK"
        required: false
        type: string
      new_sha256:
        description: "Optional SHA-256 for new APK"
        required: false
        type: string
      run_secondary_analysis:
        description: "Run additional static analysis stages"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download APKs
        env:
          OLD_URL: ${{ inputs.old_apk_url }}
          NEW_URL: ${{ inputs.new_apk_url }}
        run: |
          set -euo pipefail
          mkdir -p build/apks
          curl --fail --location --retry 3 --retry-all-errors --output build/apks/old.apk "$OLD_URL"
          curl --fail --location --retry 3 --retry-all-errors --output build/apks/new.apk "$NEW_URL"
          ls -lh build/apks

      - name: Verify SHA-256
        env:
          OLD_SHA256: ${{ inputs.old_sha256 }}
          NEW_SHA256: ${{ inputs.new_sha256 }}
        run: |
          set -euo pipefail
          old_actual="$(sha256sum build/apks/old.apk | awk '{print $1}')"
          new_actual="$(sha256sum build/apks/new.apk | awk '{print $1}')"
          echo "old_sha256=$old_actual"
          echo "new_sha256=$new_actual"
          if [ -n "$OLD_SHA256" ] && [ "$old_actual" != "${OLD_SHA256,,}" ]; then
            echo "::error::Old APK SHA-256 mismatch"
            exit 1
          fi
          if [ -n "$NEW_SHA256" ] && [ "$new_actual" != "${NEW_SHA256,,}" ]; then
            echo "::error::New APK SHA-256 mismatch"
            exit 1
          fi
          if [ "$old_actual" = "$new_actual" ]; then
            echo "::error::Old and new APKs are identical; provide two different Telegram builds"
            exit 1
          fi

      - name: Validate target Telegram builds
        run: |
          set -euo pipefail
          gradle --quiet :analyzer:run --args="--inspect build/apks/old.apk" > build/apks/old-metadata.json
          gradle --quiet :analyzer:run --args="--inspect build/apks/new.apk" > build/apks/new-metadata.json

          echo "Old APK:"
          jq '{packageName, versionName, versionCode, sha256, dexCount}' build/apks/old-metadata.json
          echo "New APK:"
          jq '{packageName, versionName, versionCode, sha256, dexCount}' build/apks/new-metadata.json

          validate() {
            local label="$1"
            local file="$2"
            local expected_version="$3"
            local expected_code="$4"

            test "$(jq -r '.packageName' "$file")" = "org.telegram.messenger" || {
              echo "::error::$label APK package must be org.telegram.messenger"
              exit 1
            }
            test "$(jq -r '.versionName' "$file")" = "$expected_version" || {
              echo "::error::$label APK versionName must be $expected_version"
              exit 1
            }
            test "$(jq -r '.versionCode' "$file")" = "$expected_code" || {
              echo "::error::$label APK versionCode must be $expected_code"
              exit 1
            }
          }

          validate "Old" build/apks/old-metadata.json "12.10.3" "70892"
          validate "New" build/apks/new-metadata.json "12.10.4" "70992"

      - name: Run differential analyzer
        run: |
          gradle :analyzer:test :analyzer:run --args="--diff ../build/apks/old.apk ../build/apks/new.apk ../build/report"

      - name: Publish run summary
        run: |
          set -euo pipefail
          report="build/report/differential-report.json"
          test -s "$report"
          {
            echo "## Telegram compatibility report"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            jq -r '.summary | to_entries[] | "| \(.key) | \(.value) |"' "$report"
            echo
            echo "### Migration status"
            jq -r '[.migrations[].status] | group_by(.) | map({status: .[0], count: length}) | .[] | "- **\(.status)**: \(.count)"' "$report"
            echo
            echo "Full JSON and Markdown reports are attached as the workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: telegram-compatibility-report
          path: build/report/
          if-no-files-found: error
